<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Номерок</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:600px;margin:auto;padding:16px 12px 28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:28px}
.logo{display:flex;align-items:center;gap:14px}.mark{width:48px;height:48px;border:1px solid #374052;border-radius:20px;display:grid;place-items:center;font-size:18px;background:#11151e}.title{font-size:29px;font-weight:800;line-height:1}.sub{color:#9da4b5;margin-top:7px;font-size:17px}
.balance{min-width:105px;padding:10px 12px;border:1px solid #303746;border-radius:20px;background:#11151e;text-align:right}.balance small{display:block;color:#9da4b5;font-size:11px}.balance b{display:block;color:#f4c84e;font-size:18px;margin-top:3px}
.card{position:relative;overflow:hidden;border:1px solid #303746;border-radius:24px;padding:13px;background:radial-gradient(circle at 50% 45%,#1b202b 0,#11151e 58%,#0d1017 100%);box-shadow:0 18px 50px #0008}
.card.rare{animation:rare .8s ease 2}.gold{position:absolute;right:18px;top:23px;width:68px;height:45px;border-radius:16px;background:linear-gradient(145deg,#ffe37b,#a87518);box-shadow:0 0 28px #e8b83b66}
.card h2{margin:0;font-size:17px}.meta{color:#9da4b5;font-size:14px;margin-top:6px}.digits{display:flex;gap:5px;justify-content:center;margin:65px 0 38px}
.digit{width:36px;height:68px;border:1px solid #3b4354;border-radius:13px;background:linear-gradient(#191e29,#090c12);display:grid;place-items:center;font-size:28px;font-weight:800;overflow:hidden;position:relative}
.digit:after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;background:#f5f6fa}
.digit.spin{animation:slot .12s linear infinite}.digit.stop{animation:pop .32s ease}
@keyframes slot{50%{transform:translateY(3px);filter:blur(1px)}}@keyframes pop{0%{transform:scale(.8);opacity:.2}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes rare{50%{box-shadow:0 0 65px #ffd34d99;border-color:#f4c84e}}
.info{border-top:1px solid #303746;padding-top:15px;display:flex;justify-content:space-between;align-items:end;gap:12px}.ready{font-size:17px;font-weight:750}.price{color:#f4c84e;font-size:16px;font-weight:800}.score{padding:8px 11px;border:1px solid #6c5420;border-radius:22px;color:#f4c84e}
button{border:0;color:#fff;font:inherit;font-weight:750;cursor:pointer}.spinbtn{width:100%;margin-top:12px;padding:15px;border-radius:25px;background:linear-gradient(100deg,#ffe078,#b98520);color:#17120a;font-size:19px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.secondary{padding:13px;border-radius:22px;background:#151a24;border:1px solid #303746;font-size:17px}.secondary:disabled,.spinbtn:disabled{opacity:.55}.auto{margin-top:10px;padding:12px 15px;border:1px solid #303746;border-radius:24px;background:#11151e;display:flex;justify-content:space-between;align-items:center;font-size:16px}.toggle{padding:10px 20px;border-radius:18px;background:#252b38}.toggle.on{background:#b88620;color:#17120a}.collection{margin-top:14px}.collection h3{font-size:17px}.item{display:flex;justify-content:space-between;gap:10px;padding:15px 16px;border:1px solid #2c3341;background:#11151e;border-radius:18px;margin-top:8px}.muted{color:#929aaa;font-size:14px}
.flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle,#ffd75e44,transparent 55%);z-index:10}.flash.show{animation:flash .9s ease}.rareLabel{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%) scale(.5);opacity:0;z-index:11;background:#f4c84e;color:#17120a;font-weight:900;padding:13px 22px;border-radius:18px;font-size:17px;box-shadow:0 0 50px #f4c84eaa;white-space:nowrap}.rareLabel.show{animation:label .9s ease}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}@keyframes label{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@media(max-width:560px){.wrap{padding:14px 10px 24px}.title{font-size:27px}.balance{min-width:98px}.digits{gap:4px;margin:58px -2px 34px}.digit{width:calc((100vw - 58px)/11);height:82px;font-size:17px;border-radius:9px}.card{padding:17px 13px}.gold{right:20px;top:30px;width:75px;height:54px}.info{align-items:center}.ready{font-size:18px}.score{font-size:14px}.spinbtn{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="logo"><div class="mark">№</div><div><div class="title">Номерок</div><div class="sub">Найди комбинацию, которую хочется оставить</div></div></div>
  <div class="balance"><small>БАЛАНС</small><b id="balance">100 000 ₽</b></div>
</header>

<section class="card" id="card">
  <div class="gold"></div>
  <h2>НОМЕРОК</h2><div class="meta">🇷🇺 Россия · 11 цифр</div>
  <div class="digits" id="digits"></div>
  <div class="info"><div><div class="ready" id="rarity">Готов крутить</div><div class="price" id="price">—</div></div><div class="score" id="score">Красота: —</div></div>
</section>

<button class="spinbtn" id="spin">🎰 Крутить</button>
<div class="row"><button class="secondary" id="sell">💸 Продать</button><button class="secondary" id="save">♡ Сохранить</button></div>
<div class="auto"><span>⚡ Автокрутка</span><button class="toggle" id="auto">ВЫКЛ</button></div>

<section class="collection"><h3>Моя коллекция</h3><div id="list"><div class="muted">Пока пусто.</div></div></section>
</div>
<div class="flash" id="flash"></div><div class="rareLabel" id="rareLabel">✨ РЕДКИЙ НОМЕР!</div>

<script>
const $=id=>document.getElementById(id);
const digits=[...Array(11)].map((_,i)=>{const x=document.createElement("span");x.className="digit";x.textContent="—";$("digits").appendChild(x);return x});
let current=null,busy=false,auto=false,timer=null;
const money=n=>Number(n).toLocaleString("ru-RU")+" ₽";
let balance=Number(localStorage.getItem("nomerok_balance")||100000);
let collection=JSON.parse(localStorage.getItem("nomerok_collection")||"[]");
$("balance").textContent=money(balance);

function makeNumber(){
  let s="";
  for(let i=0;i<11;i++)s+=Math.floor(Math.random()*10);
  return s;
}
function score(n){
  let s=50;
  if(/^(\d)\1+$/.test(n))s+=48;
  if(/(\d)\1{2,}/.test(n))s+=22;
  if(/(0123|1234|2345|3456|4567|5678|6789)/.test(n))s+=18;
  if(/(9876|8765|7654|6543|5432|4321|3210)/.test(n))s+=18;
  if(n.slice(-4)==="0000"||n.slice(-4)==="1111"||n.slice(-4)==="7777")s+=20;
  return Math.min(100,s);
}
function rarity(s){return s>=95?"Легендарный":s>=85?"Очень редкий":s>=72?"Редкий":s>=60?"Красивый":"Обычный"}
function price(s){return Math.round(500+s*s*32)}
function startAnim(){
  digits.forEach(x=>x.classList.add("spin"));
  return setInterval(()=>digits.forEach(x=>x.textContent=Math.floor(Math.random()*10)),55);
}
function finish(n){
  digits.forEach(x=>x.classList.remove("spin"));
  [...n].forEach((v,i)=>setTimeout(()=>{digits[i].textContent=v;digits[i].classList.add("stop");setTimeout(()=>digits[i].classList.remove("stop"),350)},i*90));
}
function rareFx(){ $("card").classList.remove("rare");void $("card").offsetWidth;$("card").classList.add("rare");$("flash").classList.add("show");$("rareLabel").classList.add("show");setTimeout(()=>{$("flash").classList.remove("show");$("rareLabel").classList.remove("show")},950)}
function spin(){
  if(busy)return;
  busy=true;$("spin").disabled=true;
  const interval=startAnim();
  setTimeout(()=>{
    clearInterval(interval);
    const n=makeNumber(),s=score(n),r=rarity(s),p=price(s);
    current={number:n,score:s,rarity:r,price:p};
    finish(n);$("rarity").textContent=r;$("price").textContent=money(p);$("score").textContent="Красота: "+s+"/100";
    if(s>=72)setTimeout(rareFx,850);
    setTimeout(()=>{busy=false;$("spin").disabled=false},1150);
  },1150);
}
function render(){
  $("balance").textContent=money(balance);
  $("list").innerHTML=collection.length?collection.slice().reverse().map(n=>`<div class="item"><span><b>${n.number}</b><br><small class="muted">${n.rarity} · ${n.score}/100</small></span><b>${money(n.price)}</b></div>`).join(""):'<div class="muted">Пока пусто.</div>';
}
$("spin").onclick=spin;
$("save").onclick=()=>{
  if(!current)return;
  if(!collection.some(x=>x.number===current.number)){collection.push(current);localStorage.setItem("nomerok_collection",JSON.stringify(collection));render()}
};
$("sell").onclick=()=>{
  if(!current)return;
  balance+=current.price;localStorage.setItem("nomerok_balance",balance);current=null;render();spin();
};
$("auto").onclick=()=>{
  auto=!auto;$("auto").textContent=auto?"ВКЛ":"ВЫКЛ";$("auto").classList.toggle("on",auto);
  if(auto){spin();timer=setInterval(()=>{if(!busy)spin()},3000)}else clearInterval(timer);
};
render();
</script>
</body>
</html>
