<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Номерок</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:700px;margin:auto;padding:22px 15px 50px}h1{text-align:center;font-size:38px;margin:0}.sub{text-align:center;color:#888;margin:5px 0 18px}.bal{background:#151515;border:1px solid #292929;border-radius:15px;padding:12px 15px;display:flex;justify-content:space-between;margin-bottom:14px}.bal b{color:#e6c85a}.card{background:#f5f2ec;color:#222;border-radius:25px;padding:23px}.top{display:flex;justify-content:space-between;color:#906c19;font-weight:700}.chip{width:55px;height:38px;border-radius:9px;background:#d8b95c}.stage{height:180px;display:flex;align-items:center;justify-content:center}.num{font-size:clamp(27px,7vw,50px);font-weight:900;color:#956d18;white-space:nowrap}.rolling .num{animation:roll .12s linear infinite}@keyframes roll{50%{transform:translateY(9px) rotateX(70deg)}}.bottom{display:flex;justify-content:space-between;gap:10px}.badge{background:#ead99b;padding:7px 10px;border-radius:20px;color:#765914}.buttons{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:9px;margin-top:12px}button{min-height:48px;border:0;border-radius:15px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:#fff}.dark{background:#242424;color:#fff}.auto{margin-top:10px;background:#151515;padding:13px;border-radius:15px;display:flex;justify-content:space-between}.on{background:#e6c85a}.collection{margin-top:22px}.item{background:#151515;border:1px solid #292929;padding:12px;border-radius:13px;display:flex;justify-content:space-between;margin-top:8px}.muted{color:#888}@media(max-width:520px){.buttons{grid-template-columns:1fr 1fr}.primary{grid-column:1/-1}}
</style></head><body><div class="wrap"><h1>Номерок</h1><div class="sub">Крути. Находи. Продавай.</div><div class="bal">Баланс <b id="balance">100 000 ₽</b></div>
<div class="card"><div class="top"><span>◉ Номерок<br><small>🇷🇺 Россия</small></span><div class="chip"></div></div><div class="stage" id="stage"><div class="num" id="number">Нажми «Крутить»</div></div><div class="bottom"><div><b id="rarity">—</b><br><span class="muted" id="price">—</span></div><span class="badge" id="score">Красота: —</span></div></div>
<div class="buttons"><button class="primary" id="spin">🎰 Крутить</button><button class="dark" id="sell">💸 Продать</button><button class="dark" id="save">♡ Сохранить</button></div>
<div class="auto"><span>⚡ Автокрутка</span><button class="dark" id="auto">ВЫКЛ</button></div><p class="muted">Прокручено: <b id="count">0</b></p><h2>Моя коллекция</h2><div id="list"><div class="muted">Пока пусто.</div></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const uid=tg?.initDataUnsafe?.user?.id||0;
let cur=null,busy=false,auto=false,timer=null,count=0;
const $=x=>document.getElementById(x),fmt=n=>Number(n).toLocaleString("ru-RU")+" ₽";
async function api(path,opts){let r=await fetch(path+(path.includes("?")?"&":"?")+"telegram_id="+uid,opts);if(!r.ok)throw Error(await r.text());return r.json()}
async function spin(){if(busy)return;busy=true;$("stage").classList.add("rolling");let fake=setInterval(()=>{$("number").textContent="+7 "+Array.from({length:3},()=>Math.floor(Math.random()*10)).join("")+" "+Array.from({length:2},()=>Math.floor(Math.random()*10)).join("")+"-"+Array.from({length:2},()=>Math.floor(Math.random()*10)).join("")},80);setTimeout(async()=>{clearInterval(fake);try{cur=await api("/api/spin");$("number").textContent=cur.number;$("rarity").textContent=cur.rarity;$("price").textContent=fmt(cur.price);$("score").textContent="Красота: "+cur.score+"/100";count++;$("count").textContent=count}catch(e){$("number").textContent="Ошибка"}$("stage").classList.remove("rolling");busy=false},1300)}
async function save(){if(!cur)return;await fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({telegram_id:uid,number:cur.number})});load()}
async function sell(){if(!cur)return;let r=await fetch("/api/sell",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({telegram_id:uid,number:cur.number})});let x=await r.json();$("balance").textContent=fmt(x.balance);cur=null;spin()}
async function load(){let x=await api("/api/profile");$("balance").textContent=fmt(x.balance);$("list").innerHTML=x.collection.length?x.collection.map(n=>`<div class="item"><span><b>${n.number}</b><br><small class="muted">${n.rarity} · ${n.score}/100</small></span><b>${fmt(n.price)}</b></div>`).join(""):'<div class="muted">Пока пусто.</div>'}
$("spin").onclick=spin;$("save").onclick=save;$("sell").onclick=sell;$("auto").onclick=()=>{auto=!auto;$("auto").textContent=auto?"ВКЛ":"ВЫКЛ";$("auto").classList.toggle("on",auto);if(auto){spin();timer=setInterval(()=>{if(!busy)spin()},2200)}else clearInterval(timer)};load();
</script></body></html>
